name: 新版 UI 无法显示
description: 使用诊断报告反馈安装、开机恢复或 Assistant Island 显示问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助测试 SpotlightPlus。请先更新到最新版本，开机登录后等待至少三分钟再提交。

        运行 `./diagnose.sh` 并检查生成的报告，然后将报告文件拖入下方。报告不会自动上传，也不会收集序列号、Apple Account、Siri 查询或系统统一日志。

  - type: dropdown
    id: observed_ui
    attributes:
      label: 实际出现的界面
      options:
        - 旧版 Spotlight
        - 没有任何界面
        - 小型 Ask Siri 界面
        - 新版 Assistant Island，但行为异常
        - 菜单、Dock、任务控制或 App 交互卡住
        - 其他
    validations:
      required: true

  - type: dropdown
    id: contextual_ask_siri
    attributes:
      label: 选中文字并打开右键菜单时，顶部是否出现 Ask Siri 输入框
      options:
        - 否
        - 是
        - 未测试
    validations:
      required: true

  - type: dropdown
    id: wait_time
    attributes:
      label: 登录桌面后的等待时间
      options:
        - 少于 1 分钟
        - 1–3 分钟
        - 超过 3 分钟
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
      description: 请说明安装、重启、等待和触发快捷键的顺序。
      placeholder: |
        1. 运行 install.sh
        2. 重启并登录
        3. 等待三分钟
        4. 使用快捷键……
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断报告
      description: 请拖入 SpotlightPlus-diagnostics-日期时间.txt，或粘贴其完整内容。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附截图，并说明手动打开 Siri AI.app 是否会改变结果。请先隐藏截图中的私人信息。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已使用最新版本，并在登录桌面后等待至少三分钟。
          required: true
        - label: 我已检查诊断报告和截图中没有不希望公开的信息。
          required: true
